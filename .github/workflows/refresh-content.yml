name: refresh-content

# Pulls the latest content out of Notion and commits it. Pushing to master
# triggers deploy-docs, so a Notion edit reaches the site without anyone
# running anything locally.
#
# Runs on a schedule, and can be triggered immediately:
#
#   - by hand, from the Actions tab ("Run workflow")
#   - by a Notion automation or any webhook, with a repository_dispatch:
#
#       curl -X POST https://api.github.com/repos/Giveth/giveth-docs/dispatches \
#         -H "Accept: application/vnd.github+json" \
#         -H "Authorization: Bearer <token with contents:write>" \
#         -d '{"event_type":"notion-updated"}'

on:
  schedule:
    # Every three hours. Notion edits appear within that window on their own.
    - cron: '0 */3 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [notion-updated]

concurrency:
  group: refresh-content
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Fetch from Notion
        # The script refuses to write a suspiciously small tree, and leaves the
        # committed content untouched if it cannot read Notion at all. A failed
        # asset download is reported but should not block a content update.
        run: npm run fetch-notion || echo "FETCH_WARNINGS=1" >> "$GITHUB_ENV"

      - name: Upload new videos and files to the Space
        # Runs in the same job as the fetch because the download URLs it uses
        # expire within the hour. Failing here stops the commit below, so the
        # site never references a file the Space does not have.
        env:
          DO_SPACES_KEY: ${{ secrets.DO_SPACES_KEY }}
          DO_SPACES_SECRET: ${{ secrets.DO_SPACES_SECRET }}
        run: scripts/sync-media.sh

      - name: Verify the site still builds
        run: npm run build && node scripts/check-export.mjs

      - name: Commit any changes
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content public/notion-assets public/search-index.json
          if git diff --cached --quiet; then
            echo "Notion content unchanged."
            exit 0
          fi
          git commit -q -m "Refresh content from Notion

          Generated by .github/workflows/refresh-content.yml."
          git push

      - name: Warn about assets that could not be fetched
        if: env.FETCH_WARNINGS == '1'
        run: echo "::warning::Some Notion assets could not be downloaded. See the fetch step log."
